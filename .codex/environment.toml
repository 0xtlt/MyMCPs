version = 1
name = "MyMCPs"

[setup]
script = """
set -e

if ! command -v cargo >/dev/null 2>&1; then
  echo "MyMCPs requires Rust. Install it from https://rustup.rs and rerun the Codex setup." >&2
  exit 1
fi

cargo fetch --locked

if [ ! -f .env ]; then
  cp .env.example .env
fi
"""

[[actions]]
name = "Dev"
icon = "run"
command = """
cargo run --bin mymcps
"""

[[actions]]
name = "Tests"
icon = "test"
command = """
cargo test --workspace
"""
