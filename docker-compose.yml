# Coolify-compatible self-host layout. Coolify's proxy routes traffic to the
# exposed container port; local host publishing lives in docker-compose.local.yml.
#
# Data (SQLite + Deno npm MCP sandboxes) lives in the named volume.

services:
  mymcps:
    build: .
    expose:
      - '3333'
    environment:
      TZ: UTC
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_NAME: ${APP_NAME:-MyMCPs}
      VITE_APP_NAME: ${VITE_APP_NAME:-MyMCPs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-}
      SESSION_DRIVER: cookie
      DENO_PATH: /usr/local/bin/deno
    volumes:
      - mymcps-data:/app/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  mymcps-data:
