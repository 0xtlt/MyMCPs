# Coolify-compatible self-host layout. Coolify's proxy routes traffic to the
# exposed container port; local host publishing lives in docker-compose.local.yml.
#
# Data (SQLite, the generated key, the sandboxes and packages of npm MCPs)
# lives in the named volume.
#
# npm MCPs run in a sandbox of the kernel (Landlock and seccomp) that needs no
# capability and works under no-new-privileges. It needs Linux 5.13 or later
# on the host; the server says in its log what it found when it starts.

services:
  mymcps:
    build: .
    expose:
      - '3333'
    environment:
      TZ: UTC
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-}
    volumes:
      - mymcps-data:/app/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  mymcps-data:
