# Coolify-compatible self-host layout. Coolify's proxy routes traffic to the
# exposed container port; local host publishing lives in docker-compose.local.yml.
#
# Data (SQLite, the generated key, Deno npm MCP sandboxes) lives in the named
# volume.

services:
  mymcps:
    build: .
    expose:
      - '3333'
    environment:
      TZ: UTC
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-}
      DENO_PATH: /usr/local/bin/deno
    volumes:
      - mymcps-data:/app/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  mymcps-data:
