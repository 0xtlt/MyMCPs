[package]
name = "mymcps-tailnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mymcps-vine.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
http.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The LocalAPI of tailscaled is HTTP/1 over a unix socket, with one upgrade
# (`ts-dial`): the client half of hyper is all it takes.
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
# SIGTERM for tailscaled, so that it saves its state: tokio only knows SIGKILL.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile.workspace = true
# The fake LocalAPI of the tests is a hyper server on a unix socket.
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
