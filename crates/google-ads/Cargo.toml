[package]
name = "mymcps-google-ads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The fake Google Ads API and its fixtures, for the tests of other crates.
test-util = ["dep:http"]

[dependencies]
mymcps-builtin.workspace = true
mymcps-net.workspace = true
mymcps-vine.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
url.workspace = true
uuid.workspace = true
base64.workspace = true
http = { workspace = true, optional = true }

[dev-dependencies]
mymcps-google-ads = { path = ".", features = ["test-util"] }
mymcps-core = { workspace = true, features = ["test-util"] }
tokio.workspace = true
http.workspace = true
futures.workspace = true
bytes.workspace = true
