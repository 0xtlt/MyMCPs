[package]
name = "mymcps-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
url.workspace = true
serde.workspace = true
# Numbers pass through the gateway: read them as exactly as `JSON.parse` does.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
regex.workspace = true

[target.'cfg(unix)'.dependencies]
# SIGTERM for the child of the stdio transport: tokio only knows SIGKILL.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
axum = "0.8"
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
