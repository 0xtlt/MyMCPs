[package]
name = "mymcps-tailscale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mymcps-net.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
rand.workspace = true
subtle.workspace = true
# The LocalAPI of tailscaled speaks HTTP/1.1 over a Unix socket, and its dial
# call upgrades the connection to a raw byte stream: hyper's client does both.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
# SIGTERM for tailscaled: tokio only knows SIGKILL.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
axum = "0.8"
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
