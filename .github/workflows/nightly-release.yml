name: Nightly release

on:
  schedule:
    - cron: '42 2 * * *'
  workflow_dispatch:

# Read-only by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Installs and runs dependency code, so it only gets a read-only token and
  # leaves no credentials in the checkout.
  validate:
    name: Validate nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Plan nightly release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json')).version")"
          short_sha="$(git rev-parse --short=7 HEAD)"
          release_date="$(date -u +%Y%m%d)"
          nightly_version="$(node --input-type=module --eval "import { nightlyVersion } from './.github/scripts/prepare-release.mjs'; console.log(nightlyVersion(process.argv[1], process.argv[2], process.argv[3]))" "$current_version" "$release_date" "$short_sha")"
          tag="v$nightly_version"
          last_nightly="$(git tag --list 'v*-nightly.*' --sort=-creatordate | awk 'NR == 1 { print; exit }')"

          if [[ -n "$last_nightly" && "$(git rev-list -n 1 "$last_nightly")" == "$(git rev-parse HEAD)" ]]; then
            tag="$last_nightly"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "No commits have landed since $last_nightly; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          previous_tag="$last_nightly"
          if [[ "$previous_tag" == "$tag" ]]; then
            previous_tag="$(git tag --list 'v*-nightly.*' --sort=-creatordate | awk -v current="$tag" '$0 != current { print; exit }')"
          fi
          if [[ -z "$previous_tag" ]]; then
            previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | awk '!/-/ { print; exit }')"
          fi

          if [[ -n "$previous_tag" && "$(git rev-list -n 1 "$previous_tag")" == "$(git rev-parse HEAD)" ]]; then
            echo "No commits have landed since $previous_tag; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "publish=true"
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.plan.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Enable pnpm cache
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=360

      - name: Install browser
        if: steps.plan.outputs.publish == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release automation
        if: steps.plan.outputs.publish == 'true'
        run: pnpm run test:release

      - name: Validate application
        if: steps.plan.outputs.publish == 'true'
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
          pnpm audit --audit-level=high

  # Holds the write token, so it installs nothing and runs no dependency code.
  release:
    name: Publish nightly release
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      release_tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Credentials stay in the checkout: the publish step pushes the tag.
      - name: Check out the validated commit with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.validate.outputs.sha }}

      # The validation job ran dependency code, so its outputs are checked
      # before anything is tagged.
      - name: Verify the validated commit and tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The validation job did not report a commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]]; then
            echo "Checked-out revision does not match the validated commit $VALIDATED_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$VALIDATED_SHA" refs/remotes/origin/main; then
            echo "Validated commit $VALIDATED_SHA is not on main." >&2
            exit 1
          fi
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.g([0-9a-f]{7,40})$'
          if [[ ! "$TAG" =~ $tag_pattern ]] || [[ "$VALIDATED_SHA" != "${BASH_REMATCH[1]}"* ]]; then
            echo "Nightly tag $TAG does not name the validated commit $VALIDATED_SHA." >&2
            exit 1
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/nightly-release-notes.md"
          arguments=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            --field "tag_name=$TAG"
            --field "target_commitish=$(git rev-parse HEAD)"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            arguments+=(--field "previous_tag_name=$PREVIOUS_TAG")
          fi
          gh api "${arguments[@]}" --jq .body > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish nightly prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Nightly $TAG"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --verify-tag

          {
            echo "published=true"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Published nightly prerelease [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

  publish-container:
    name: Publish nightly container
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      release_channel: nightly
      release_tag: ${{ needs.release.outputs.release_tag }}
