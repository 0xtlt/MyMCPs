name: Publish release container

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact published Git release tag
        required: true
        type: string
      release_channel:
        description: Release channel (stable or nightly)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, validate, and publish OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_NAME: ghcr.io/0xtlt/mymcps
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SMOKE_IMAGE: mymcps-smoke:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_CHANNEL" in
            stable)
              tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
              ;;
            nightly)
              tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.g[0-9a-f]{7}$'
              ;;
            *)
              echo "Unsupported release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac

          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "Release tag $RELEASE_TAG is invalid for the $RELEASE_CHANNEL channel." >&2
            exit 1
          fi

      - name: Check out the published tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Resolve image revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "Checked-out revision does not match $RELEASE_TAG." >&2
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha,scope=mymcps-release-image
          cache-to: type=gha,mode=max,scope=mymcps-release-image

      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail

          container_name="mymcps-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          APP_KEY="base64:$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")"
          export APP_KEY
          docker run --detach \
            --name "$container_name" \
            --env APP_KEY \
            --env APP_URL=http://localhost:3333 \
            --env LOG_LEVEL=info \
            --env SESSION_DRIVER=cookie \
            "$SMOKE_IMAGE" >/dev/null

          for _ in {1..60}; do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_name")"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]] || [[ "$(docker inspect --format='{{.State.Running}}' "$container_name")" != "true" ]]; then
              break
            fi
            sleep 2
          done

          docker logs "$container_name"
          echo "Container did not become healthy through /health on port 3333." >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-platform image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.release_channel }}
            ${{ env.IMAGE_NAME }}:${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=mymcps-release-image
          cache-to: type=gha,mode=max,scope=mymcps-release-image

      - name: Summarize published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          {
            echo '## Published container image'
            echo
            echo "- \`$IMAGE_NAME:$RELEASE_CHANNEL\`"
            echo "- \`$IMAGE_NAME:$RELEASE_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
