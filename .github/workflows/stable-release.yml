name: Stable release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Read-only by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Rust toolchain of the project: the one the Dockerfile compiles the
  # image with (crates/xtask checks that they agree). Every job that runs
  # cargo installs it and makes it the default first.
  RUST_TOOLCHAIN: 1.98.1

jobs:
  # Compiles and runs dependency code, so it only gets a read-only token and
  # leaves no credentials in the checkout.
  validate:
    name: Validate stable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      # Recorded before any dependency code runs.
      - name: Record the commit under validation
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
          fallback: none

      - name: Validate release automation
        run: cargo test --locked -p xtask

      - name: Validate application
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked --bin mymcps
          cargo audit

  # Holds the write token, so it runs no dependency code: preparing the
  # release only needs the Rust toolchain and the repository's own xtask crate,
  # which has no dependencies. Cargo reads the crates.io index to check
  # Cargo.lock, and downloads and compiles nothing but xtask.
  release:
    name: Publish stable release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      # Credentials stay in the checkout: the release commit and tag are pushed.
      - name: Check out the validated commit with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.validate.outputs.sha }}

      # The validation job ran dependency code, so its output is checked
      # before anything is committed or tagged.
      - name: Verify the validated commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The validation job did not report a commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]]; then
            echo "Checked-out revision does not match the validated commit $VALIDATED_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$VALIDATED_SHA" refs/remotes/origin/main; then
            echo "Validated commit $VALIDATED_SHA is not on main." >&2
            exit 1
          fi

      # No cache: nothing written by the validation job is restored here.
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Prepare version and changelog
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(cargo run --locked -p xtask -- version)"
          current_tag="v$current_version"
          head_sha="$(git rev-parse HEAD)"
          latest_stable_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | awk '!/-/ { print; exit }')"
          mode="prepare"
          notes_target="$head_sha"

          if git rev-parse --verify --quiet "refs/tags/$current_tag" >/dev/null && \
            [[ "$(git rev-list -n 1 "$current_tag")" == "$head_sha" ]]; then
            if gh release view "$current_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "There are no unreleased commits after $current_tag." >&2
              exit 1
            fi
            mode="recover-tag"
            previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | awk -v current="$current_tag" '$0 != current && !/-/ { print; exit }')"
            tag="$current_tag"
            version="$current_version"
          elif ! git rev-parse --verify --quiet "refs/tags/$current_tag" >/dev/null && \
            [[ "$(git log -1 --format=%s)" == "chore(release): prepare $current_tag" ]]; then
            mode="recover-commit"
            previous_tag="$latest_stable_tag"
            notes_target="$(git rev-parse HEAD^)"
            tag="$current_tag"
            version="$current_version"
          else
            if [[ -z "$latest_stable_tag" || "$latest_stable_tag" != "$current_tag" ]]; then
              echo "Cargo.toml version $current_version does not match the latest stable tag ${latest_stable_tag:-<none>}." >&2
              exit 1
            fi
            if [[ "$(git rev-list --count "$latest_stable_tag"..HEAD)" == "0" ]]; then
              echo "There are no unreleased commits after $latest_stable_tag." >&2
              exit 1
            fi

            previous_tag="$latest_stable_tag"
            cargo run --locked -p xtask -- prepare-release \
              --bump "$BUMP" \
              --date "$(date -u +%F)" \
              --repository "$GITHUB_REPOSITORY"
            version="$(cargo run --locked -p xtask -- version)"
            tag="v$version"
          fi

          {
            echo "mode=$mode"
            echo "notes_target=$notes_target"
            echo "previous_tag=$previous_tag"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # --locked makes Cargo refuse the Cargo.lock that was just rewritten
      # unless it is exactly the one Cargo would write for the new version.
      - name: Check generated release files
        run: |
          git diff --check
          cargo test --locked -p xtask

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_TARGET: ${{ steps.release.outputs.notes_target }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/stable-release-notes.md"
          arguments=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            --field "tag_name=$TAG"
            --field "target_commitish=$NOTES_TARGET"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            arguments+=(--field "previous_tag_name=$PREVIOUS_TAG")
          fi
          gh api "${arguments[@]}" --jq .body > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push release
        env:
          MODE: ${{ steps.release.outputs.mode }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$MODE" == "prepare" ]]; then
            git add -- Cargo.toml Cargo.lock CHANGELOG.md
            git commit --message "chore(release): prepare $TAG"
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git tag --annotate "$TAG" --message "Release $TAG"
          fi

          if [[ "$MODE" == "recover-tag" ]]; then
            echo "$TAG is already present on the remote; continuing release recovery."
          else
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          fi

      - name: Publish GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --verify-tag

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published stable release [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

  publish-container:
    name: Publish stable container
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      release_channel: stable
      release_tag: ${{ needs.release.outputs.release_tag }}
