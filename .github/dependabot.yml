version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:17'
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:17'
    open-pull-requests-limit: 10

  # Base images in the Dockerfile: the Rust toolchain that compiles the server,
  # the Debian runtime, and the Deno binary that sandboxes npm MCP packages.
  # A Rust bump also needs RUST_TOOLCHAIN updated in the workflows, and a
  # Deno bump DENO_VERSION in the Dockerfile; `cargo test -p xtask` fails until
  # they agree. The Debian release is chosen by hand: both the rust and the
  # debian tag name it, and an update keeps that part of a tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:17'
    open-pull-requests-limit: 10
